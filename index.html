<!DOCTYPE html>

<option value="Banho de lua - R$ 90 a R$ 180">Banho de lua - R$ 90 a R$ 180</option>
<option value="Pump Up Glúteos - R$ 80 a R$ 150">Pump Up (Glúteos) - R$ 80 a R$ 150</option>

<option value="Botox 1 área - R$ 1.200">💉 Botox 1 área - R$ 1.200</option>
<option value="Bigode Chinês - R$ 1.800">💋 Bigode Chinês - R$ 1.800</option>
</optgroup>
</select>

<div class="row"><input type="date" id="data" required><input type="time" id="hora" required></div>

</form>

<footer>Studio Lídia Siqueira • Belém - PA 💅</footer>
